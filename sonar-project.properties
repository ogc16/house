# SonarCloud / SonarQube project configuration.
# Adjust sonar.projectKey and sonar.organization to match your SonarCloud project.
sonar.projectKey=ogc16_house
sonar.organization=ogc16
sonar.projectName=The Pavilion House

sonar.sourceEncoding=UTF-8
sonar.sources=.
sonar.tests=test
sonar.test.inclusions=test/**/*.test.js

# Coverage report produced by `npm run test:coverage`
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Generated / vendored files are not part of the reviewed code base.
sonar.exclusions=node_modules/**,coverage/**,**/*.min.js

# UI glue that only has meaning in a browser is excluded from coverage,
# while still being analysed for maintainability, reliability and security.
sonar.coverage.exclusions=app.js,test/**,vitest.config.mjs

# index.html and styles.css are presentation/content, not logic. Excluding
# them from copy-paste detection keeps the duplication metric focused on code.
sonar.cpd.exclusions=index.html,styles.css
